name: Build Email Organizer with BERT

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install -r requirements.txt
    
    - name: Verify BERT installation
      run: |
        python -c "from sentence_transformers import SentenceTransformer; print('BERT OK')"
        python -c "import torch; print(f'PyTorch {torch.__version__} OK')"
    
    - name: Build executable (folder mode for BERT)
      run: |
        pyinstaller --onedir --windowed --name EmailOrganizer ^
          --icon=NONE ^
          --add-data "README.md;." ^
          --hidden-import=sentence_transformers ^
          --hidden-import=torch ^
          --hidden-import=numpy ^
          --hidden-import=sklearn ^
          --hidden-import=openpyxl ^
          --hidden-import=extract_msg ^
          --collect-all sentence_transformers ^
          --collect-all torch ^
          --collect-all transformers ^
          email_sorter.py
    
    - name: Create portable package
      run: |
        cd dist
        Compress-Archive -Path EmailOrganizer -DestinationPath EmailOrganizer-BERT-Windows.zip
    
    - name: Upload artifact
      uses: actions/upload-artifact@v3
      with:
        name: EmailOrganizer-BERT-Windows
        path: dist/EmailOrganizer-BERT-Windows.zip
