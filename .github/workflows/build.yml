name: Build and Release Email Organizer with BERT

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install -r requirements.txt
    
    - name: Verify BERT installation
      run: |
        python -c "from sentence_transformers import SentenceTransformer; print('BERT OK')"
        python -c "import torch; print(f'PyTorch {torch.__version__} OK')"
    
    - name: Build executable (folder mode for BERT)
      run: |
        pyinstaller --onedir --windowed --name EmailOrganizer `
          --hidden-import=sentence_transformers `
          --hidden-import=torch `
          --hidden-import=numpy `
          --hidden-import=sklearn `
          --hidden-import=openpyxl `
          --hidden-import=extract_msg `
          --collect-all sentence_transformers `
          --collect-all torch `
          --collect-all transformers `
          email_sorter.py
    
    - name: Create portable package
      run: |
        cd dist
        Compress-Archive -Path EmailOrganizer -DestinationPath EmailOrganizer-BERT-Windows.zip
    
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: dist/EmailOrganizer-BERT-Windows.zip
        body: |
          ## Email Organizer with BERT AI
          
          **Features:**
          - 85-90% accuracy with BERT
          - Multi-language support (Korean, English, French)
          - Topic keywords
          - Learning from corrections
          - Thread detection
          
          **Requirements:**
          - Windows 10/11
          - Extract the folder and run EmailOrganizer.exe
          
          **First run:** Downloads BERT model (2-3 minutes)
          **After that:** 20-30 seconds per batch
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Upload artifact (for non-release builds)
      if: "!startsWith(github.ref, 'refs/tags/')"
      uses: actions/upload-artifact@v4
      with:
        name: EmailOrganizer-BERT-Windows-${{ github.sha }}
        path: dist/EmailOrganizer-BERT-Windows.zip
        retention-days: 7
